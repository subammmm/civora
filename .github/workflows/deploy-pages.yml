name: Deploy Next.js static export to GitHub Pages (Backup Only)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# IMPORTANT: This deploys a static backup to github.io/civora/
# civora.me domain is served by Vercel, not GitHub Pages
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build:static
        env:
          EXPORT_MODE: 'true'

      - name: Verify critical files in build output
        run: |
          echo "Checking for critical files in out/ directory..."
          ls -la out/
          test -f out/index.html && echo "✓ index.html present" || echo "✗ index.html missing"
          test -d out/assets && echo "✓ assets/ directory present" || echo "✗ assets/ directory missing"
          test -f out/.nojekyll && echo "✓ .nojekyll present" || echo "✗ .nojekyll missing"
          test -f out/404.html && echo "✓ 404.html present" || echo "✗ 404.html missing"
          echo "Note: CNAME file intentionally excluded - civora.me served by Vercel, not GitHub Pages"
          echo "GitHub Pages available at: https://subammmm.github.io/civora/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
