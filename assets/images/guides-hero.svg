<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bgGradient)"/>
  
  <!-- Study desk with books and materials -->
  <g transform="translate(100,150)">
    <!-- Desk -->
    <rect x="0" y="80" width="600" height="120" rx="8" fill="#333" stroke="#C28840" stroke-width="2"/>
    
    <!-- Books stack 1 -->
    <rect x="50" y="40" width="80" height="15" fill="#B22222" opacity="0.8"/>
    <rect x="50" y="25" width="80" height="15" fill="#006400" opacity="0.8"/>
    <rect x="50" y="10" width="80" height="15" fill="#C28840" opacity="0.8"/>
    
    <!-- Books stack 2 -->
    <rect x="200" y="50" width="80" height="15" fill="#006400" opacity="0.7"/>
    <rect x="200" y="35" width="80" height="15" fill="#B22222" opacity="0.7"/>
    <rect x="200" y="20" width="80" height="15" fill="#C28840" opacity="0.7"/>
    <rect x="200" y="5" width="80" height="15" fill="#006400" opacity="0.7"/>
    
    <!-- Open book -->
    <g transform="translate(350,30)">
      <path d="M0 30 Q40 20 80 30 L80 70 Q40 60 0 70 Z" fill="#E5E5E5" opacity="0.9"/>
      <path d="M80 30 Q120 20 160 30 L160 70 Q120 60 80 70 Z" fill="#E5E5E5" opacity="0.9"/>
      <!-- Text lines -->
      <line x1="10" y1="40" x2="70" y2="40" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      <line x1="10" y1="50" x2="70" y2="50" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      <line x1="10" y1="60" x2="50" y2="60" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      <line x1="90" y1="40" x2="150" y2="40" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      <line x1="90" y1="50" x2="150" y2="50" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
      <line x1="90" y1="60" x2="130" y2="60" stroke="#1a1a1a" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
  
  <!-- Templates and documents -->
  <g transform="translate(150,100)">
    <!-- Document 1 -->
    <rect x="0" y="0" width="60" height="80" rx="3" fill="#E5E5E5" stroke="#C28840" stroke-width="1"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="25" x2="50" y2="25" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="35" x2="40" y2="35" stroke="#1a1a1a" stroke-width="1"/>
    <text x="30" y="55" fill="#C28840" text-anchor="middle" font-size="8" font-weight="bold">TEMPLATE</text>
  </g>
  
  <g transform="translate(250,110)">
    <!-- Document 2 -->
    <rect x="0" y="0" width="60" height="80" rx="3" fill="#E5E5E5" stroke="#006400" stroke-width="1"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="25" x2="50" y2="25" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="35" x2="40" y2="35" stroke="#1a1a1a" stroke-width="1"/>
    <text x="30" y="55" fill="#006400" text-anchor="middle" font-size="8" font-weight="bold">GUIDE</text>
  </g>
  
  <g transform="translate(350,105)">
    <!-- Document 3 -->
    <rect x="0" y="0" width="60" height="80" rx="3" fill="#E5E5E5" stroke="#B22222" stroke-width="1"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="25" x2="50" y2="25" stroke="#1a1a1a" stroke-width="1"/>
    <line x1="10" y1="35" x2="40" y2="35" stroke="#1a1a1a" stroke-width="1"/>
    <text x="30" y="55" fill="#B22222" text-anchor="middle" font-size="8" font-weight="bold">CHECKLIST</text>
  </g>
  
  <!-- Laptop with application -->
  <g transform="translate(500,120)">
    <rect x="0" y="40" width="120" height="80" rx="5" fill="#333" stroke="#C28840" stroke-width="2"/>
    <rect x="5" y="45" width="110" height="70" fill="#1a1a1a"/>
    <rect x="15" y="55" width="90" height="50" fill="#E5E5E5" opacity="0.2"/>
    <!-- Screen content -->
    <rect x="25" y="65" width="70" height="8" fill="#C28840" opacity="0.7"/>
    <rect x="25" y="78" width="70" height="4" fill="#E5E5E5" opacity="0.5"/>
    <rect x="25" y="85" width="50" height="4" fill="#E5E5E5" opacity="0.5"/>
    <rect x="25" y="92" width="60" height="4" fill="#E5E5E5" opacity="0.5"/>
  </g>
  
  <!-- Floating icons -->
  <g transform="translate(80,50)" opacity="0.4">
    <circle cx="15" cy="15" r="12" fill="#C28840"/>
    <text x="15" y="20" fill="#1a1a1a" text-anchor="middle" font-size="12" font-weight="bold">?</text>
  </g>
  
  <g transform="translate(650,80)" opacity="0.4">
    <circle cx="15" cy="15" r="12" fill="#006400"/>
    <path d="M10 15 L13 18 L20 11" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  </g>
</svg>