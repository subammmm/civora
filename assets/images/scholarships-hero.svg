<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bgGradient)"/>
  
  <!-- Students studying -->
  <g transform="translate(100,80)">
    <!-- Student 1 -->
    <circle cx="50" cy="30" r="20" fill="#E5E5E5" opacity="0.6"/>
    <rect x="30" y="50" width="40" height="50" rx="8" fill="#E5E5E5" opacity="0.6"/>
    <!-- Laptop -->
    <rect x="20" y="90" width="60" height="35" rx="3" fill="#333" stroke="#C28840" stroke-width="1"/>
    <rect x="25" y="95" width="50" height="25" fill="#C28840" opacity="0.3"/>
  </g>
  
  <g transform="translate(300,90)">
    <!-- Student 2 -->
    <circle cx="50" cy="30" r="20" fill="#E5E5E5" opacity="0.5"/>
    <rect x="30" y="50" width="40" height="50" rx="8" fill="#E5E5E5" opacity="0.5"/>
    <!-- Books -->
    <rect x="10" y="90" width="15" height="40" fill="#006400" opacity="0.7"/>
    <rect x="30" y="90" width="15" height="35" fill="#B22222" opacity="0.7"/>
    <rect x="50" y="90" width="15" height="45" fill="#C28840" opacity="0.7"/>
    <rect x="70" y="90" width="15" height="30" fill="#006400" opacity="0.7"/>
  </g>
  
  <g transform="translate(500,75)">
    <!-- Student 3 -->
    <circle cx="50" cy="30" r="20" fill="#E5E5E5" opacity="0.7"/>
    <rect x="30" y="50" width="40" height="50" rx="8" fill="#E5E5E5" opacity="0.7"/>
    <!-- Study materials -->
    <rect x="25" y="95" width="50" height="30" rx="2" fill="#333" stroke="#C28840" stroke-width="1"/>
    <circle cx="80" cy="110" r="8" fill="#C28840" opacity="0.8"/>
  </g>
  
  <!-- Money/scholarship symbols -->
  <g transform="translate(150,180)">
    <rect x="0" y="0" width="80" height="50" rx="5" fill="#006400" opacity="0.6"/>
    <text x="40" y="30" fill="#E5E5E5" text-anchor="middle" font-size="20" font-weight="bold">$</text>
  </g>
  
  <g transform="translate(350,170)">
    <rect x="0" y="0" width="80" height="50" rx="5" fill="#C28840" opacity="0.6"/>
    <text x="40" y="30" fill="#1a1a1a" text-anchor="middle" font-size="20" font-weight="bold">€</text>
  </g>
  
  <g transform="translate(550,185)">
    <rect x="0" y="0" width="80" height="50" rx="5" fill="#B22222" opacity="0.6"/>
    <text x="40" y="30" fill="#E5E5E5" text-anchor="middle" font-size="20" font-weight="bold">¥</text>
  </g>
  
  <!-- Floating achievement icons -->
  <g transform="translate(200,50)" opacity="0.4">
    <circle cx="15" cy="15" r="12" fill="#C28840"/>
    <path d="M10 15 L13 18 L20 11" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  </g>
  
  <g transform="translate(450,40)" opacity="0.4">
    <circle cx="15" cy="15" r="12" fill="#006400"/>
    <path d="M10 15 L13 18 L20 11" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  </g>
</svg>