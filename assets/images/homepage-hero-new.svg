<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Clean geometric education elements -->
  <g opacity="0.1">
    <!-- Books stack -->
    <rect x="100" y="150" width="80" height="12" fill="#C00000" rx="2"/>
    <rect x="105" y="140" width="70" height="12" fill="#C00000" rx="2"/>
    <rect x="110" y="130" width="60" height="12" fill="#C00000" rx="2"/>
    
    <!-- Graduation cap outline -->
    <path d="M300 120 L380 120 L390 140 L380 160 L300 160 L290 140 Z" stroke="#C00000" stroke-width="2" fill="none"/>
    <line x1="375" y1="120" x2="375" y2="180" stroke="#C00000" stroke-width="2"/>
    <circle cx="375" cy="180" r="4" fill="#C00000"/>
    
    <!-- Globe network -->
    <circle cx="600" cy="200" r="60" stroke="#C00000" stroke-width="2" fill="none"/>
    <path d="M600 140 C600 140, 630 160, 630 200 C630 240, 600 260, 600 260" stroke="#C00000" stroke-width="1" fill="none"/>
    <path d="M600 140 C600 140, 570 160, 570 200 C570 240, 600 260, 600 260" stroke="#C00000" stroke-width="1" fill="none"/>
    <line x1="540" y1="200" x2="660" y2="200" stroke="#C00000" stroke-width="1"/>
    
    <!-- Connection lines -->
    <path d="M180 156 Q 240 100 290 140" stroke="#C00000" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <path d="M380 140 Q 480 120 540 200" stroke="#C00000" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Subtle text overlay -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle" opacity="0.5">Global Education Opportunities</text>
</svg>