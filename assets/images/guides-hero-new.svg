<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Clean guides/templates elements -->
  <g opacity="0.15">
    <!-- Documents/Templates -->
    <rect x="150" y="100" width="100" height="140" fill="none" stroke="#C00000" stroke-width="2" rx="4"/>
    <rect x="160" y="110" width="80" height="8" fill="#C00000" opacity="0.5" rx="1"/>
    <line x1="160" y1="130" x2="230" y2="130" stroke="#C00000" stroke-width="1"/>
    <line x1="160" y1="145" x2="220" y2="145" stroke="#C00000" stroke-width="1"/>
    <line x1="160" y1="160" x2="225" y2="160" stroke="#C00000" stroke-width="1"/>
    <line x1="160" y1="175" x2="210" y2="175" stroke="#C00000" stroke-width="1"/>
    <line x1="160" y1="190" x2="235" y2="190" stroke="#C00000" stroke-width="1"/>
    <line x1="160" y1="205" x2="215" y2="205" stroke="#C00000" stroke-width="1"/>
    <line x1="160" y1="220" x2="230" y2="220" stroke="#C00000" stroke-width="1"/>
    
    <!-- Checklist -->
    <rect x="350" y="120" width="100" height="120" fill="none" stroke="#C00000" stroke-width="2" rx="4"/>
    <circle cx="365" cy="140" r="3" stroke="#C00000" stroke-width="1" fill="none"/>
    <line x1="375" y1="140" x2="430" y2="140" stroke="#C00000" stroke-width="1"/>
    <circle cx="365" cy="160" r="3" stroke="#C00000" stroke-width="1" fill="#C00000"/>
    <line x1="375" y1="160" x2="425" y2="160" stroke="#C00000" stroke-width="1"/>
    <circle cx="365" cy="180" r="3" stroke="#C00000" stroke-width="1" fill="#C00000"/>
    <line x1="375" y1="180" x2="435" y2="180" stroke="#C00000" stroke-width="1"/>
    <circle cx="365" cy="200" r="3" stroke="#C00000" stroke-width="1" fill="none"/>
    <line x1="375" y1="200" x2="420" y2="200" stroke="#C00000" stroke-width="1"/>
    <circle cx="365" cy="220" r="3" stroke="#C00000" stroke-width="1" fill="none"/>
    <line x1="375" y1="220" x2="440" y2="220" stroke="#C00000" stroke-width="1"/>
    
    <!-- Download arrow -->
    <path d="M550 120 L580 120 L580 180 L600 180 L575 210 L550 180 L570 180 L570 120 Z" fill="#C00000" opacity="0.7"/>
    
    <!-- File folder -->
    <path d="M550 250 L650 250 L650 300 L550 300 Z" stroke="#C00000" stroke-width="2" fill="none"/>
    <path d="M550 250 L580 250 L590 240 L620 240 L630 250" stroke="#C00000" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text overlay -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle" opacity="0.5">Application Guides & Templates</text>
</svg>