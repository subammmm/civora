<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bgGradient)"/>
  
  <!-- Passports -->
  <g transform="translate(100,80)">
    <rect x="0" y="0" width="80" height="110" rx="5" fill="#B22222" stroke="#C28840" stroke-width="2"/>
    <rect x="10" y="15" width="60" height="40" rx="2" fill="#E5E5E5" opacity="0.8"/>
    <text x="40" y="80" fill="#E5E5E5" text-anchor="middle" font-size="12" font-weight="bold">PASSPORT</text>
    <circle cx="40" cy="35" r="15" fill="#1a1a1a" opacity="0.3"/>
  </g>
  
  <g transform="translate(220,90)">
    <rect x="0" y="0" width="80" height="110" rx="5" fill="#006400" stroke="#C28840" stroke-width="2"/>
    <rect x="10" y="15" width="60" height="40" rx="2" fill="#E5E5E5" opacity="0.8"/>
    <text x="40" y="80" fill="#E5E5E5" text-anchor="middle" font-size="12" font-weight="bold">PASSPORT</text>
    <circle cx="40" cy="35" r="15" fill="#1a1a1a" opacity="0.3"/>
  </g>
  
  <!-- Visa stamps -->
  <g transform="translate(350,70)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#333" stroke="#C28840" stroke-width="2"/>
    <text x="60" y="25" fill="#C28840" text-anchor="middle" font-size="14" font-weight="bold">VISA</text>
    <text x="60" y="45" fill="#E5E5E5" text-anchor="middle" font-size="10">APPROVED</text>
    <circle cx="90" cy="55" r="8" fill="#C28840" opacity="0.7"/>
  </g>
  
  <g transform="translate(500,90)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#333" stroke="#006400" stroke-width="2"/>
    <text x="60" y="25" fill="#006400" text-anchor="middle" font-size="14" font-weight="bold">WORK PERMIT</text>
    <text x="60" y="45" fill="#E5E5E5" text-anchor="middle" font-size="10">GRANTED</text>
    <circle cx="90" cy="55" r="8" fill="#006400" opacity="0.7"/>
  </g>
  
  <!-- Citizenship certificate -->
  <g transform="translate(300,180)">
    <rect x="0" y="0" width="200" height="100" rx="5" fill="#1e1e1e" stroke="#C28840" stroke-width="3"/>
    <text x="100" y="30" fill="#C28840" text-anchor="middle" font-size="16" font-weight="bold">CITIZENSHIP</text>
    <text x="100" y="50" fill="#E5E5E5" text-anchor="middle" font-size="14">CERTIFICATE</text>
    <path d="M80 65 L90 75 L120 45" stroke="#006400" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Flag representations -->
  <g transform="translate(50,200)" opacity="0.6">
    <rect x="0" y="0" width="60" height="40" fill="#B22222"/>
    <rect x="0" y="13" width="60" height="14" fill="#E5E5E5"/>
  </g>
  
  <g transform="translate(650,50)" opacity="0.6">
    <rect x="0" y="0" width="60" height="40" fill="#006400"/>
    <rect x="0" y="13" width="60" height="14" fill="#C28840"/>
  </g>
  
  <!-- Arrows showing progression -->
  <path d="M200 150 L280 150" stroke="#C28840" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M480 150 L550 150" stroke="#C28840" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C28840"/>
    </marker>
  </defs>
</svg>