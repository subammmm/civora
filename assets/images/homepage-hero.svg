<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Globe with graduation caps -->
  <circle cx="400" cy="200" r="120" stroke="#C28840" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M400 80 C400 80, 450 120, 450 200 C450 280, 400 320, 400 320" stroke="#C28840" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M400 80 C400 80, 350 120, 350 200 C350 280, 400 320, 400 320" stroke="#C28840" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M280 200 L520 200" stroke="#C28840" stroke-width="2" opacity="0.5"/>
  <path d="M300 150 L500 150" stroke="#C28840" stroke-width="1.5" opacity="0.4"/>
  <path d="M300 250 L500 250" stroke="#C28840" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Graduation caps around the globe -->
  <g transform="translate(300,120)">
    <path d="M0 0 L40 0 L45 10 L40 20 L0 20 L-5 10 Z" fill="#C28840" opacity="0.8"/>
    <rect x="38" y="0" width="4" height="25" fill="#C28840" opacity="0.8"/>
    <circle cx="40" cy="25" r="3" fill="#C28840" opacity="0.8"/>
  </g>
  
  <g transform="translate(480,160)">
    <path d="M0 0 L40 0 L45 10 L40 20 L0 20 L-5 10 Z" fill="#C28840" opacity="0.6"/>
    <rect x="38" y="0" width="4" height="25" fill="#C28840" opacity="0.6"/>
    <circle cx="40" cy="25" r="3" fill="#C28840" opacity="0.6"/>
  </g>
  
  <g transform="translate(320,280)">
    <path d="M0 0 L40 0 L45 10 L40 20 L0 20 L-5 10 Z" fill="#C28840" opacity="0.7"/>
    <rect x="38" y="0" width="4" height="25" fill="#C28840" opacity="0.7"/>
    <circle cx="40" cy="25" r="3" fill="#C28840" opacity="0.7"/>
  </g>
  
  <!-- Students silhouettes -->
  <g transform="translate(150,280)" opacity="0.4">
    <circle cx="20" cy="20" r="15" fill="#E5E5E5"/>
    <rect x="5" y="35" width="30" height="40" rx="5" fill="#E5E5E5"/>
  </g>
  
  <g transform="translate(600,250)" opacity="0.3">
    <circle cx="20" cy="20" r="15" fill="#E5E5E5"/>
    <rect x="5" y="35" width="30" height="40" rx="5" fill="#E5E5E5"/>
  </g>
  
  <!-- Connecting lines representing global reach -->
  <path d="M400 200 Q 200 100 100 150" stroke="#006400" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M400 200 Q 600 100 700 150" stroke="#006400" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M400 200 Q 300 350 150 320" stroke="#006400" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M400 200 Q 500 350 650 320" stroke="#006400" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,5"/>
</svg>