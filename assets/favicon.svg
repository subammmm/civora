<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .globe { fill: #111827; }
      .continents { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        .globe { fill: #f9fafb; }
        .continents { fill: #111827; }
      }
    </style>
  </defs>
  <!-- Globe circle -->
  <circle cx="16" cy="16" r="14" class="globe" stroke="#6b7280" stroke-width="1"/>
  <!-- Simplified continent shapes -->
  <path d="M8 12 Q12 10 16 12 Q20 10 24 12 L24 20 Q16 18 8 20 Z" class="continents"/>
  <path d="M10 8 Q14 6 18 8 Q20 6 22 8 L22 12 Q18 10 14 12 Q12 10 10 12 Z" class="continents"/>
  <!-- Small dots for islands/cities -->
  <circle cx="12" cy="22" r="1" class="continents"/>
  <circle cx="20" cy="24" r="1" class="continents"/>
</svg>