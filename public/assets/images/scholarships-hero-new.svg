<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Clean scholarship elements -->
  <g opacity="0.15">
    <!-- Document/Application forms -->
    <rect x="150" y="100" width="120" height="160" fill="none" stroke="#C00000" stroke-width="2" rx="4"/>
    <line x1="170" y1="130" x2="250" y2="130" stroke="#C00000" stroke-width="1"/>
    <line x1="170" y1="150" x2="230" y2="150" stroke="#C00000" stroke-width="1"/>
    <line x1="170" y1="170" x2="240" y2="170" stroke="#C00000" stroke-width="1"/>
    <line x1="170" y1="190" x2="220" y2="190" stroke="#C00000" stroke-width="1"/>
    
    <!-- Award/Medal -->
    <circle cx="400" cy="180" r="40" stroke="#C00000" stroke-width="3" fill="none"/>
    <polygon points="400,160 410,170 400,180 390,170" fill="#C00000"/>
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="12" fill="#C00000" text-anchor="middle">$</text>
    
    <!-- Money/Funding symbols -->
    <rect x="550" y="120" width="100" height="120" fill="none" stroke="#C00000" stroke-width="2" rx="8"/>
    <text x="600" y="180" font-family="Arial, sans-serif" font-size="24" fill="#C00000" text-anchor="middle">$$$</text>
    
    <!-- Connection lines -->
    <path d="M270 180 Q 330 150 360 180" stroke="#C00000" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
    <path d="M440 180 Q 490 160 550 180" stroke="#C00000" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Text overlay -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle" opacity="0.5">Scholarship Database</text>
</svg>